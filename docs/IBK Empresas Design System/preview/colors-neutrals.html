<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Colors · Neutrals</title><link rel="stylesheet" href="../colors_and_type.css">
<style>body{background:#fff;padding:20px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.sw{border-radius:8px;overflow:hidden;border:1px solid var(--line);}
.chip{height:56px;}
.meta{padding:6px 8px;background:#fff;}
.name{font-family:var(--font-display);font-weight:500;font-size:12px;color:var(--fg-1);}
.hex{font-family:var(--font-num);font-size:10px;color:var(--fg-4);}
</style></head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#0F191E"></div><div class="meta"><div class="name">Ink</div><div class="hex">#0F191E · fg-1</div></div></div>
  <div class="sw"><div class="chip" style="background:#333333"></div><div class="meta"><div class="name">Body</div><div class="hex">#333333 · fg-2</div></div></div>
  <div class="sw"><div class="chip" style="background:#4A4A4A"></div><div class="meta"><div class="name">Muted</div><div class="hex">#4A4A4A · fg-3</div></div></div>
  <div class="sw"><div class="chip" style="background:#878C8F"></div><div class="meta"><div class="name">Meta</div><div class="hex">#878C8F · fg-4</div></div></div>
  <div class="sw"><div class="chip" style="background:#B7BABC"></div><div class="meta"><div class="name">Disabled</div><div class="hex">#B7BABC · fg-6</div></div></div>
  <div class="sw"><div class="chip" style="background:#D9DADB"></div><div class="meta"><div class="name">Line</div><div class="hex">#D9DADB · line-strong</div></div></div>
  <div class="sw"><div class="chip" style="background:#ECEDED"></div><div class="meta"><div class="name">Line soft</div><div class="hex">#ECEDED · line</div></div></div>
  <div class="sw"><div class="chip" style="background:#F4F5F7"></div><div class="meta"><div class="name">Page</div><div class="hex">#F4F5F7 · bg-page</div></div></div>
</div></body></html>
