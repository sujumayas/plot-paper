<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Elevation</title><link rel="stylesheet" href="../colors_and_type.css">
<style>body{background:#F4F5F7;padding:22px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;}
.box{width:140px;height:76px;background:#fff;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:500;color:#333;font-size:13px;}
.n{font-family:var(--font-num);font-size:10px;color:#878C8F;text-align:center;text-transform:uppercase;letter-spacing:.04em;}
</style></head><body>
<div class="grid">
  <div class="cell"><div class="box" style="box-shadow:0 4px 10px rgba(0,0,0,0.05)">Card</div><div class="n">Shadow-card · soft</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 1px 4px rgba(0,134,63,0.2);background:#00A94F;color:#fff;border-radius:24px;height:48px">Continuar</div><div class="n">Btn-primary · green tint</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 8px 24px rgba(0,0,0,0.12)">Float</div><div class="n">Shadow-float · dropdown</div></div>
</div></body></html>
