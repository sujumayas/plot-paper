<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Radii</title><link rel="stylesheet" href="../colors_and_type.css">
<style>body{background:#fff;padding:22px;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;}
.box{width:64px;height:64px;background:#ECEDED;border:1px solid #D9DADB;}
.n{font-family:var(--font-num);font-size:10px;color:#878C8F;text-transform:uppercase;letter-spacing:.04em;}
</style></head><body>
<div class="grid">
  <div class="cell"><div class="box" style="border-radius:4px"></div><div class="n">4 · xs · inputs</div></div>
  <div class="cell"><div class="box" style="border-radius:5px"></div><div class="n">5 · sm · cards</div></div>
  <div class="cell"><div class="box" style="border-radius:12px"></div><div class="n">12 · md · tiles</div></div>
  <div class="cell"><div class="box" style="border-radius:20px"></div><div class="n">20 · lg · pills</div></div>
  <div class="cell"><div class="box" style="border-radius:24px"></div><div class="n">24 · xl · CTA</div></div>
</div></body></html>
