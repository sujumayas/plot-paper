<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Colors · Brand</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{background:#fff;padding:20px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.sw{border-radius:8px;overflow:hidden;border:1px solid var(--line);}
.chip{height:68px;}
.meta{padding:8px 10px;background:#fff;}
.name{font-family:var(--font-display);font-weight:500;font-size:13px;color:var(--fg-1);}
.hex{font-family:var(--font-num);font-size:11px;color:var(--fg-4);letter-spacing:.02em;}
</style></head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#05BE50"></div><div class="meta"><div class="name">Brand green</div><div class="hex">#05BE50 · ibk-green</div></div></div>
  <div class="sw"><div class="chip" style="background:#00A94F"></div><div class="meta"><div class="name">Green dark</div><div class="hex">#00A94F · ibk-green-dark</div></div></div>
  <div class="sw"><div class="chip" style="background:#CDF2DC"></div><div class="meta"><div class="name">Green soft</div><div class="hex">#CDF2DC · ibk-green-soft</div></div></div>
  <div class="sw"><div class="chip" style="background:#0039A6"></div><div class="meta"><div class="name">Brand blue</div><div class="hex">#0039A6 · ibk-blue</div></div></div>
  <div class="sw"><div class="chip" style="background:#2F4A9F"></div><div class="meta"><div class="name">Blue deep</div><div class="hex">#2F4A9F · ibk-blue-deep</div></div></div>
  <div class="sw"><div class="chip" style="background:#64B4E6"></div><div class="meta"><div class="name">Blue sky</div><div class="hex">#64B4E6 · ibk-blue-sky</div></div></div>
</div></body></html>
