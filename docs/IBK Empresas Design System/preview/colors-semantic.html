<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Colors · Semantic</title><link rel="stylesheet" href="../colors_and_type.css">
<style>body{background:#fff;padding:20px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.sw{border-radius:8px;overflow:hidden;border:1px solid var(--line);}
.chip{height:62px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:500;font-size:13px;}
.meta{padding:8px 10px;background:#fff;}
.name{font-family:var(--font-display);font-weight:500;font-size:13px;color:var(--fg-1);}
.hex{font-family:var(--font-num);font-size:11px;color:var(--fg-4);}
</style></head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#EB0046">Error</div><div class="meta"><div class="name">Red</div><div class="hex">#EB0046 · red</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFB406;color:#0F191E">Warning</div><div class="meta"><div class="name">Amber</div><div class="hex">#FFB406 · amber</div></div></div>
  <div class="sw"><div class="chip" style="background:#F99100">Orange</div><div class="meta"><div class="name">Orange</div><div class="hex">#F99100 · orange</div></div></div>
  <div class="sw"><div class="chip" style="background:#CDF2DC;color:#05BE50">Success · chip</div><div class="meta"><div class="name">Green soft</div><div class="hex">#CDF2DC + #05BE50</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFEFCA;color:#F99100">Warning · chip</div><div class="meta"><div class="name">Amber soft</div><div class="hex">#FFEFCA + #F99100</div></div></div>
  <div class="sw"><div class="chip" style="background:#00A94F">Positive</div><div class="meta"><div class="name">Green dark</div><div class="hex">#00A94F · ibk-green-dark</div></div></div>
</div></body></html>
