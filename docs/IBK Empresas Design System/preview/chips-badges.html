<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Chips & Badges</title><link rel="stylesheet" href="../colors_and_type.css">
<style>body{background:#fff;padding:22px;display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.pill{border-radius:20px;padding:8px 14px;font-family:Montserrat;font-size:12px;display:inline-flex;align-items:center;gap:6px;}
.pill-dot{width:8px;height:8px;border-radius:50%;}
.promo{background:#CDF2DC;border-radius:20px;padding:8px 14px;display:inline-flex;gap:10px;align-items:center;}
.promo b{font-family:Montserrat;font-weight:700;color:#05BE50;font-size:13px;}
.promo span{font-family:Inter;color:#0F191E;font-size:11px;}
</style></head><body>
<div class="row">
  <span class="pill" style="background:#CDF2DC;color:#05BE50;font-weight:700">Completado</span>
  <span class="pill" style="background:#FFEFCA;color:#F99100;font-weight:700">En proceso</span>
  <span class="pill" style="background:#FDE4EA;color:#EB0046;font-weight:700">Rechazado</span>
  <span class="pill" style="background:#ECEDED;color:#333;font-weight:700">Borrador</span>
</div>
<div class="row">
  <span class="pill" style="background:#fff;border:1px solid #D9DADB;color:#333"><i class="pill-dot" style="background:#05BE50"></i>Activo</span>
  <span class="pill" style="background:#fff;border:1px solid #D9DADB;color:#878C8F"><i class="pill-dot" style="background:#B7BABC"></i>Inactivo</span>
</div>
<div class="row">
  <div class="promo">
    <span style="display:inline-block;width:20px;height:20px;background:url(../assets/icons/combos.svg) center/contain no-repeat;"></span>
    <div><b>Usa tu TC especial</b><br><span>Compra S/ 3.270 · Venta S/ 3.270</span></div>
  </div>
</div>
</body></html>
