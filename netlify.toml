[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Optional, set in the Netlify dashboard (see docs/self-hosting.md):
  #   ANTHROPIC_API_KEY                 enables AI (server-side only)
  #   NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY   accounts + community gallery

[[headers]]
  for = "/auth/callback"
  [headers.values]
    Cache-Control = "no-store"
