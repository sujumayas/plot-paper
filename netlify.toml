[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY set in dashboard.
  # ANTHROPIC_API_KEY lives as a Supabase edge function secret, NOT here.

[[headers]]
  for = "/auth/callback"
  [headers.values]
    Cache-Control = "no-store"
